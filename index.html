<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>졸라맨 원소 RPG - 퀘스트 & 육성</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: #06080d; color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; overflow: hidden; 
        }
        #gameContainer { 
            position: relative; 
            box-shadow: 0 0 45px rgba(0, 229, 255, 0.3); 
            border-radius: 12px; overflow: hidden; 
            border: 2px solid #1a233a; 
        }
        canvas { background: #000; display: block; }
        
        /* UI 오버레이 */
        #uiOverlay { 
            position: absolute; top: 15px; left: 15px; 
            pointer-events: none; 
            background: rgba(8, 12, 20, 0.9); 
            padding: 14px 20px; border-radius: 10px; 
            border: 1px solid #00e5ff; font-size: 13px; line-height: 1.6; 
        }
        #questBox {
            position: absolute; top: 15px; right: 15px;
            background: rgba(8, 12, 20, 0.9);
            padding: 10px 18px; border-radius: 8px;
            border: 1px solid #ffeb3b; font-size: 13px; color: #ffeb3b;
        }
        .stat-val { color: #00ffcc; font-weight: bold; }
        .controls { 
            margin-top: 12px; color: #9aaec4; font-size: 13px; 
            background: #101622; padding: 10px 24px; border-radius: 20px; 
            border: 1px solid #233148; 
        }

        /* 원소 선택 화면 오버레이 */
        #charSelectScreen {
            position: absolute; top: 0; left: 0; width: 960px; height: 520px;
            background: rgba(5, 8, 15, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20;
        }
        .select-title { font-size: 26px; color: #00e5ff; margin-bottom: 25px; font-weight: bold; text-shadow: 0 0 10px #00e5ff; }
        .elem-cards { display: flex; gap: 20px; }
        .elem-card {
            background: #121a2e; border: 2px solid #25334d; border-radius: 12px;
            padding: 20px; width: 160px; text-align: center; cursor: pointer; transition: all 0.2s;
        }
        .elem-card:hover { border-color: #00ffcc; transform: translateY(-5px); box-shadow: 0 5px 20px rgba(0,255,204,0.3); }
        .elem-card h3 { margin: 5px 0 10px 0; color: #fff; }
        .elem-card p { font-size: 11px; color: #9aaec4; line-height: 1.4; }

        #notifyBox {
            position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 0, 85, 0.85); color: #fff; padding: 8px 20px;
            border-radius: 20px; font-weight: bold; font-size: 14px; display: none;
            box-shadow: 0 0 20px #ff0055; z-index: 10;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <!-- 게임 시작 시 원소 선택 화면 -->
    <div id="charSelectScreen">
        <div class="select-title">✨ 주력 원소를 선택하세요 (영구 결정)</div>
        <div class="elem-cards">
            <div class="elem-card" onclick="selectElement('fire')">
                <h3 style="color:#ff3300;">🔥 불</h3>
                <p>폭발적인 광역 화력과 강력한 딜링 특화</p>
            </div>
            <div class="elem-card" onclick="selectElement('water')">
                <h3 style="color:#00bfff;">💧 물</h3>
                <p>적을 얼리는 빙결 제어 및 안정적 전투</p>
            </div>
            <div class="elem-card" onclick="selectElement('earth')">
                <h3 style="color:#d2b48c;">🪨 흙</h3>
                <p>묵직한 중량 타격과 튼튼한 방어력</p>
            </div>
            <div class="elem-card" onclick="selectElement('air')">
                <h3 style="color:#e0ffff;">💨 공기</h3>
                <p>초고속 연속 베기와 화려한 질풍 기동</p>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas" width="960" height="520"></canvas>
    
    <div id="uiOverlay">
        <div><strong>👑 등급:</strong> <span id="rankText" class="stat-val">1등급 (x1.0)</span></div>
        <div><strong>❤️ HP:</strong> <span id="hpText" class="stat-val">100/100</span></div>
        <div><strong>⚔️ 공격력:</strong> <span id="atkText" class="stat-val">15</span></div>
        <div><strong>✨ 내 원소:</strong> <span id="elemText" class="stat-val">-</span></div>
        <div><strong>🌟 SP:</strong> <span id="spText" class="stat-val" style="color:#ffeb3b;">0</span></div>
    </div>

    <div id="questBox">📜 퀘스트: <span id="questText">원소를 선택하고 사냥을 시작하세요!</span></div>
    <div id="notifyBox">알림 메시지</div>
</div>

<div class="controls">
    🎮 [← / →] 이동 | [Space] 점프 | [↑] 포탈 | [Z] 원소 검격 | [X] 원소 극의 스킬
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const RANK_MULT = { 1: 1.0, 2: 3.0, 3: 10.0, 4: 50.0, 5: 1000.0 };

const ELEMENTS = {
    fire: { name: "🔥 불 (폭발형)", color: "#ff3300", glow: "#ff9100", dmgBonus: 1.3 },
    water: { name: "💧 물 (빙결형)", color: "#00bfff", glow: "#00ffff", dmgBonus: 1.0 },
    earth: { name: "🪨 흙 (지진형)", color: "#d2b48c", glow: "#ffcc66", dmgBonus: 1.5 },
    air: { name: "💨 공기 (질풍형)", color: "#e0ffff", glow: "#ffffff", dmgBonus: 1.1 }
};

const player = {
    x: 100, y: 300, width: 24, height: 48, vx: 0, vy: 0,
    isGrounded: false, facing: 'right', rank: 1,
    baseHp: 100, baseAtk: 15,
    elementKey: null, sp: 0, kills: 0,
    isAttacking: false, attackTimer: 0,
    isSkill: false, skillTimer: 0
};

let gameStarted = false;
let currentQuestIdx = 0;
const quests = [
    { title: "슬라임 3마리 토벌하기", targetKills: 3 },
    { title: "고대 유적의 포탈을 타고 이동하기", targetRegion: 1 },
    { title: "2등급으로 승급하기", targetRank: 2 }
];

const REGIONS = [
    { name: "인간 지역 - 고대 마법 유적", bgColor: ['#060912', '#121a2e'], platColor: '#25334d', mType: '슬라임', mHp: 40 },
    { name: "몬스터 지역 - 생명의 대림", bgColor: ['#05140a', '#0f2b17'], platColor: '#174023', mType: '변이 야수', mHp: 150 }
];
let currentRegionIdx = 0;

const platforms = [
    { x: 0, y: 450, width: 960, height: 70 },
    { x: 100, y: 350, width: 220, height: 16 },
    { x: 640, y: 350, width: 220, height: 16 },
    { x: 360, y: 250, width: 240, height: 16 }
];
const portals = [{ x: 890, y: 330, width: 60, height: 120, targetDir: 1 }];

let monsters = [];
let particles = [];
let damageTexts = [];
let shakeTime = 0, shakeIntensity = 0;

function triggerShake(duration, intensity) {
    shakeTime = duration;
    shakeIntensity = intensity;
}

function selectElement(elemKey) {
    player.elementKey = elemKey;
    gameStarted = true;
    document.getElementById('charSelectScreen').style.display = 'none';
    spawnMonsters();
    updateQuestText();
    showNotify(`🎉 ${ELEMENTS[elemKey].name} 계파로 각성했습니다!`);
}

function spawnMonsters() {
    monsters = [];
    const reg = REGIONS[currentRegionIdx] || REGIONS[0];
    for (let i = 0; i < 3; i++) {
        monsters.push({
            x: 250 + i * 220, y: 200, width: 34, height: 34,
            hp: reg.mHp, maxHp: reg.mHp, vx: (i % 2 === 0 ? 1 : -1) * 1.5,
            type: reg.mType, frozen: 0
        });
    }
}

function showNotify(msg) {
    const box = document.getElementById('notifyBox');
    box.innerText = msg;
    box.style.display = 'block';
    setTimeout(() => { box.style.display = 'none'; }, 2500);
}

function updateQuestText() {
    const qBox = document.getElementById('questText');
    if (currentQuestIdx === 0) {
        qBox.innerText = `슬라임 토벌 (${player.kills}/3)`;
        if (player.kills >= 3) {
            currentQuestIdx++;
            player.sp += 2;
            showNotify("📜 퀘스트 완료! SP +2 획득");
            updateQuestText();
        }
    } else if (currentQuestIdx === 1) {
        qBox.innerText = `포탈을 타고 다음 지역으로 이동하기 [↑]`;
    } else {
        qBox.innerText = `자유 탐험 및 성장 중!`;
    }
}

const keys = {};
window.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Space'].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
});
window.addEventListener('keyup', e => keys[e.key] = false);

function addDamageText(x, y, damage, color = '#ffeb3b') {
    damageTexts.push({ x, y, text: Math.floor(damage), opacity: 1, vy: -2, color });
}

function createImpactParticles(x, y, elemData, count = 15) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
            size: Math.random() * 6 + 2, life: 22, maxLife: 22,
            color: elemData.color, glow: elemData.glow
        });
    }
}

function attackHit(range, isSkill = false) {
    if (!gameStarted) return;
    const elem = ELEMENTS[player.elementKey];
    const mult = RANK_MULT[player.rank];
    let baseDmg = (isSkill ? player.baseAtk * 3.5 : player.baseAtk) * elem.dmgBonus;
    const dmg = baseDmg * mult;

    triggerShake(isSkill ? 12 : 6, isSkill ? 8 : 4);

    const hitBox = {
        x: player.facing === 'right' ? player.x + player.width : player.x - range,
        y: player.y - 15, width: range, height: player.height + 30
    };

    monsters.forEach((m, idx) => {
        if (hitBox.x < m.x + m.width && hitBox.x + hitBox.width > m.x &&
            hitBox.y < m.y + m.height && hitBox.y + hitBox.height > m.y) {
            
            m.hp -= dmg;
            addDamageText(m.x + 10, m.y - 10, dmg, isSkill ? elem.glow : '#ffffff');
            createImpactParticles(m.x + m.width / 2, m.y + m.height / 2, elem, isSkill ? 25 : 12);

            if (player.elementKey === 'water' && isSkill) m.frozen = 60;

            if (m.hp <= 0) {
                monsters.splice(idx, 1);
                player.kills++;
                player.sp += 1;
                player.baseAtk += 3;
                updateQuestText();

                if (player.kills % 5 === 0 && player.rank < 5) {
                    player.rank++;
                    showNotify(`🎉 ${player.rank}등급으로 승급했습니다!`);
                } else {
                    showNotify(`🌟 SP 획득! (현재 SP: ${player.sp})`);
                }

                setTimeout(() => {
                    const reg = REGIONS[currentRegionIdx] || REGIONS[0];
                    monsters.push({
                        x: Math.random() * 600 + 150, y: 100,
                        width: 34, height: 34, hp: reg.mHp, maxHp: reg.mHp,
                        vx: 1.5, type: reg.mType, frozen: 0
                    });
                }, 1500);
            }
        }
    });
}

function update() {
    if (!gameStarted) return;
    const speed = 5.2;

    if (keys['ArrowLeft']) { player.vx = -speed; player.facing = 'left'; }
    else if (keys['ArrowRight']) { player.vx = speed; player.facing = 'right'; }
    else { player.vx = 0; }

    if ((keys['Space'] || keys[' ']) && player.isGrounded) {
        player.vy = -12;
        player.isGrounded = false;
    }

    if (keys['ArrowUp']) {
        portals.forEach(port => {
            if (player.x < port.x + port.width && player.x + player.width > port.x &&
                player.y < port.y + port.height && player.y + player.height > port.y) {
                if (currentRegionIdx < REGIONS.length - 1) {
                    currentRegionIdx++; player.x = 90; spawnMonsters();
                    if (currentQuestIdx === 1) { currentQuestIdx++; showNotify("📜 퀘스트 완료! 다음 지역 진입"); updateQuestText(); }
                }
            }
        });
    }

    if ((keys['z'] || keys['Z']) && !player.isAttacking && !player.isSkill) {
        player.isAttacking = true; player.attackTimer = 10;
        attackHit(65, false);
    }
    if (player.attackTimer > 0) player.attackTimer--; else player.isAttacking = false;

    if ((keys['x'] || keys['X']) && !player.isSkill && !player.isAttacking) {
        player.isSkill = true; player.skillTimer = 20;
        attackHit(120, true);
    }
    if (player.skillTimer > 0) player.skillTimer--; else player.isSkill = false;

    player.vy += 0.6;
    player.x += player.vx;
    player.y += player.vy;
    player.isGrounded = false;

    platforms.forEach(plat => {
        if (player.x < plat.x + plat.width && player.x + player.width > plat.x &&
            player.y + player.height >= plat.y && player.y + player.height <= plat.y + 16 &&
            player.vy >= 0) {
            player.y = plat.y - player.height;
            player.vy = 0;
            player.isGrounded = true;
        }
    });

    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

    monsters.forEach(m => {
        if (m.frozen > 0) m.frozen--;
        else {
            m.x += m.vx;
            if (m.x < 50 || m.x > 880) m.vx *= -1;
        }
    });

    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    });

    damageTexts.forEach((d, i) => {
        d.y += d.vy; d.opacity -= 0.03;
        if (d.opacity <= 0) damageTexts.splice(i, 1);
    });

    const elem = ELEMENTS[player.elementKey];
    const mult = RANK_MULT[player.rank];

    document.getElementById('rankText').innerText = `${player.rank}등급 (x${mult})`;
    document.getElementById('hpText').innerText = `${Math.floor(player.baseHp * mult)}/${Math.floor(player.baseHp * mult)}`;
    document.getElementById('atkText').innerText = `${Math.floor(player.baseAtk * mult)}`;
    document.getElementById('elemText').innerText = elem.name;
    document.getElementById('spText').innerText = player.sp;
}

function draw() {
    ctx.save();
    if (shakeTime > 0) {
        ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
        shakeTime--;
    }

    const reg = REGIONS[currentRegionIdx] || REGIONS[0];
    const elem = gameStarted ? ELEMENTS[player.elementKey] : { color: '#fff', glow: '#fff' };

    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, reg.bgColor[0]);
    grad.addColorStop(1, reg.bgColor[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    platforms.forEach(plat => {
        ctx.fillStyle = reg.platColor;
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(plat.x, plat.y, plat.width, 4);
    });

    portals.forEach(port => {
        ctx.shadowBlur = 15; ctx.shadowColor = '#00e5ff';
        ctx.fillStyle = 'rgba(0, 229, 255, 0.2)';
        ctx.fillRect(port.x, port.y, port.width, port.height);
        ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2;
        ctx.strokeRect(port.x, port.y, port.width, port.height);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#00e5ff'; ctx.font = '12px sans-serif';
        ctx.fillText("포탈 [↑]", port.x + 8, port.y - 10);
    });

    monsters.forEach(m => {
        ctx.fillStyle = m.frozen > 0 ? '#00ffff' : '#ff3366';
        ctx.beginPath(); ctx.arc(m.x + m.width / 2, m.y + m.height / 2, m.width / 2, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(m.x, m.y - 10, m.width, 5);
        ctx.fillStyle = '#00ffcc'; ctx.fillRect(m.x, m.y - 10, (m.hp / m.maxHp) * m.width, 5);
    });

    particles.forEach(p => {
        ctx.shadowBlur = 10; ctx.shadowColor = p.glow || p.color;
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.shadowBlur = 0;
    });

    if (gameStarted) {
        const px = player.x + player.width / 2;
        const py = player.y;

        if (player.rank >= 2) {
            ctx.shadowBlur = 20; ctx.shadowColor = elem.glow;
            ctx.strokeStyle = elem.color; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(px, py + 20, 28 + player.rank * 4, 0, Math.PI * 2); ctx.stroke();
            ctx.shadowBlur = 0;
        }

        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(px, py + 10, 8, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px, py + 18); ctx.lineTo(px, py + 34); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px, py + 34); ctx.lineTo(px - 8, py + 48); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px, py + 34); ctx.lineTo(px + 8, py + 48); ctx.stroke();

        const dir = player.facing === 'right' ? 1 : -1;
        ctx.beginPath(); ctx.moveTo(px, py + 22);

        if (player.isAttacking) {
            ctx.lineTo(px + (26 * dir), py + 18); ctx.stroke();
            ctx.shadowBlur = 25; ctx.shadowColor = elem.glow; ctx.strokeStyle = elem.color; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.arc(px, py + 20, 45, player.facing === 'right' ? -0.8 : 2.2, player.facing === 'right' ? 0.8 : 4.0); ctx.stroke();
            ctx.shadowBlur = 0;
        } else if (player.isSkill) {
            ctx.lineTo(px + (18 * dir), py + 10); ctx.stroke();
            ctx.shadowBlur = 35; ctx.shadowColor = elem.glow; ctx.fillStyle = elem.color;
            ctx.beginPath(); ctx.arc(px + (70 * dir), py + 20, 40, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
        } else {
            ctx.lineTo(px - 8, py + 28); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px, py + 22); ctx.lineTo(px + 8, py + 28); ctx.stroke();
        }
    }

    damageTexts.forEach(d => {
        ctx.shadowBlur = 8; ctx.shadowColor = d.color; ctx.fillStyle = d.color;
        ctx.font = 'bold 18px sans-serif'; ctx.globalAlpha = d.opacity;
        ctx.fillText(d.text, d.x, d.y);
        ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
    });

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
